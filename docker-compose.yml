services:
  launchpad:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - launchpad_data:/data
      - launchpad_uploads:/uploads
    env_file: .env
    # These override .env so a local DATABASE_PATH does not shadow the volumes.
    environment:
      DATABASE_PATH: /data/launchpad.db
      UPLOADS_DIR: /uploads
      PORT: "3001"
    restart: unless-stopped
    healthcheck:
      # oven/bun:1-slim has bun, and does not ship wget or curl.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  launchpad_data:
  launchpad_uploads:
